version: 1
dataset: products
keys: [product_id]
expectations:
  product_id_not_null: {severity: quarantine, expression: "product_id IS NOT NULL"}
  non_negative_price: {severity: quarantine, expression: "unit_price >= 0"}
  updated_at_not_null: {severity: quarantine, expression: "updated_at IS NOT NULL"}
  product_name_population: {severity: metric, expression: "name IS NOT NULL AND trim(name) <> ''"}
