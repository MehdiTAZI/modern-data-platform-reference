name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_contracts.py
      - run: pytest -q --cov=mdpr --cov-report=term-missing
      - run: python -m build --wheel
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.15.9'}
      - run: terraform fmt -check -recursive infra
      - name: Validate roots
        run: |
          for d in infra/stacks/state-backend infra/stacks/azure-foundation infra/stacks/workspace-governance; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
