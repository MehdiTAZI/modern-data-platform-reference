name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_actions_pinned.py
      - run: ruff format --check .
      - run: ruff check .
      - run: python scripts/validate_repo.py
      - run: python scripts/validate_contracts.py
      - run: pytest -q --cov=mdpr --cov-report=term-missing
      - run: python -m build --wheel
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: pip install -e '.[dev]'
      - name: Audit project dependency graph
        run: pip-audit . --strict --desc=off
      - name: Audit resolved Python environment
        run: pip-audit --local --skip-editable --desc=off
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: '1.15.9'}
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with: {tflint_version: 'v0.59.1'}
      - run: terraform fmt -check -recursive infra
      - name: TFLint
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" -f compact
      - name: Validate locked roots
        run: |
          for d in infra/stacks/state-backend infra/stacks/azure-foundation infra/stacks/workspace-governance infra/stacks/azure-dr-secondary; do
            test -f "$d/.terraform.lock.hcl"
            terraform -chdir=$d init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$d validate
          done
      - name: Test state backend security
        run: terraform -chdir=infra/stacks/state-backend test
      - name: Test platform deployment profiles
        run: terraform -chdir=infra/stacks/azure-foundation test
      - name: Test serverless NCC guardrails
        run: terraform -chdir=infra/stacks/workspace-governance test
  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
          format: table
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5f0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
