name: Generate Terraform lockfiles

on:
  push:
    branches: [v1.4-reproducible-infra]
    paths:
      - '.github/workflows/generate-terraform-lockfiles.yml'
      - 'infra/**/*.tf'
      - 'infra/**/.terraform.lock.hcl'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v1.4-reproducible-infra
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
      - name: Generate multi-platform provider locks
        shell: bash
        run: |
          set -euo pipefail
          for d in \
            infra/stacks/state-backend \
            infra/stacks/azure-foundation \
            infra/stacks/workspace-governance \
            infra/stacks/azure-dr-secondary; do
            terraform -chdir="$d" providers lock \
              -platform=linux_amd64 \
              -platform=darwin_amd64 \
              -platform=darwin_arm64
          done
      - name: Commit generated lockfiles
        shell: bash
        run: |
          git add infra/stacks/*/.terraform.lock.hcl
          if git diff --cached --quiet; then
            echo 'Terraform lockfiles are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock Terraform providers'
          git push origin HEAD:v1.4-reproducible-infra
