[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-data-platform-reference"
version = "0.1.0"
description = "Production-oriented Databricks lakehouse reference architecture"
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5,<4.1",
  "delta-spark>=3.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["applications*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
