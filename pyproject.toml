[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modern-data-platform-reference"
version = "1.6.0"
description = "Architecture-first Databricks lakehouse reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "pip-audit>=2.10.1,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "pyspark>=4.0,<4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["spark: requires a local Spark runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["pyspark", "yaml"]

[tool.coverage.run]
source = ["mdpr"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
