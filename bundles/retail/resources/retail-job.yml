resources:
  jobs:
    retail_batch:
      name: retail-${var.environment}-batch
      tasks:
        - task_key: bronze_customers
          spark_python_task:
            python_file: ../../../applications/retail/batch/bronze_customers.py
            parameters:
              - --source-path
              - /Volumes/${var.environment}_bronze/retail/landing/customers/*.csv
              - --environment
              - ${var.environment}

        - task_key: silver_customers
          depends_on:
            - task_key: bronze_customers
          spark_python_task:
            python_file: ../../../applications/retail/batch/silver_customers.py
            parameters:
              - --environment
              - ${var.environment}
