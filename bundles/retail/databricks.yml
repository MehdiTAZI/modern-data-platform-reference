bundle:
  name: retail-data-product

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}
    variables:
      environment: dev

  staging:
    mode: production
    workspace:
      host: ${var.workspace_host}
    variables:
      environment: staging

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
    variables:
      environment: prod

variables:
  workspace_host:
    description: Databricks workspace URL supplied by deployment environment
  environment:
    description: Logical application environment
